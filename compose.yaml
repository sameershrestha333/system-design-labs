services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: products
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab-local
    ports:
      - "127.0.0.1:5435:5432"
  kafka:
    image: apache/kafka:4.4.0
    ports:
      - "127.0.0.1:9092:9092"

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"