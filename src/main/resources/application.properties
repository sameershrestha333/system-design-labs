spring.application.name=system-design-labs

# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5435/products
spring.datasource.username=lab
spring.datasource.password=lab-local

# Run schema.sql on startup against PostgreSQL
spring.sql.init.mode=always

# Redis connection and cache expiration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=30s

# Show when the product lookup queries PostgreSQL
logging.level.org.springframework.jdbc.core.JdbcTemplate=DEBUG